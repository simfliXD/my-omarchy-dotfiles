#####################
###  WINDOWRULES  ###
#####################

##############
###  TAGS  ###
##############


# browser tags
windowrule = tag +browser, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag +browser, match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^(chrome-.+-Default)$ # Chrome PWAs
windowrule = tag +browser, match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag +browser, match:class ^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = tag +browser, match:class ^(zen-alpha|zen)$

windowrule = tag -browser, match:title ^([Dd]iscord.*)$ # For discord webapps

# Notif tags
windowrule = tag +notif, match:class ^(swaync-control-center|swaync-notification-window|swaync-client|class)$

# Terminal tags
windowrule = tag +terminal, match:class ^(Ghostty|Alacritty|kitty|kitty-dropterm)$

# Email tags
windowrule = tag +email, match:class ^([Tt]hunderbird|org.gnome.Evolution)$
windowrule = tag +email, match:class ^(eu.betterbird.Betterbird)$

# Socialmeida tags
windowrule = tag +socialmedia, match:title ^([Dd]iscord.*)$
windowrule = tag +socialmedia, match:class ^(discord|vesktop|Vencord|)
windowrule = tag +socialmedia, match:class ^(Slack|Signal|TelegramDesktop|whatsapp-for-linux|Element|skypeforlinux|zoom|Microsoft Teams)$

# Code_editor tags
windowrule = tag +code_editor, match:class ^(codium|codium-url-handler|VSCodium)$
windowrule = tag +code_editor, match:class ^(VSCode|code|code-url-handler)$
windowrule = tag +code_editor, match:class ^(jetbrains-.+)$ # JetBrains IDEs
windowrule = tag +code_editor, match:class ^(emacs|org.gnu.emacs)$
windowrule = tag +code_editor, match:class ^(sublime_text)$
windowrule = tag +code_editor, match:class ^(kate)$
windowrule = tag +code_editor, match:class ^(micro|micro-editor)$
windowrule = tag +code_editor, match:class ^(.*.[Zz]ed)$

# Photo/Video editor tags
windowrule = tag +photo_video_editor, match:class ^(gimp|.*Pinta)$
windowrule = tag +photo_video_editor, match:class ^(kdenlive|shotcut|openshot-qt|flowblade)$
windowrule = tag +photo_video_editor, match:class ^(davinci-resolve|davinci-resolve-studio)$
windowrule = tag +photo_video_editor, match:class ^(darktable|rawtherapee)$

# Game tags
windowrule = tag +games, match:class ^(gamescope)$
windowrule = tag +games, match:class ^([Mm]inecraft.*)$
windowrule = tag +games, match:content 3 # Content type 3 = game

# Gamelauncher tags
windowrule = tag +gamelauncher, match:class ^(steam_app_\d+|steam)$
windowrule = tag +gamelauncher, match:title ^(Epic Games Launcher)$
windowrule = tag +gamelauncher, match:class ^(Lutris|HeroicGamesLauncher|faugus-launcher)$
windowrule = tag +gamelauncher, match:class ^(.*atlauncher.*)$

# Multimedia tags
windowrule = tag +multimedia, match:class ^([Aa]udacious)$
windowrule = tag +multimedia_video, match:class ^([Mm]pv|vlc)$

# Music tags
windowrule = tag +music, match:class ^(.*spotatui|spotify-qt|[Ss]potify|spotify-tui)$
windowrule = tag +music, match:title ^(spt - spotatui|spotify-tui)$
windowrule = tag +music, match:class ^(cliamp)$

# Settings tags
windowrule = tag +settings, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = tag +settings, match:class ^(qt5ct|qt6ct|[Yy]ad)$


######################################
###   Window rules based on tags   ###
######################################


#windowrule = workspace 1, match:tag browser*
windowrule = workspace 5, match:tag email*
windowrule = workspace 2, match:tag gamelauncher*
windowrule = workspace 2, match:tag games*
windowrule = workspace 4, match:tag code_editor*
windowrule = workspace 2, match:tag multimedia_video*
windowrule = workspace 6, match:tag music*


### DIALOGS

windowrule = float 1, center 1, pin 1, match:initial_title ^(Authentication Required)$
windowrule = float 1, center 1, pin 1, match:initial_title (Select Folder)$
windowrule = float 1, center 1, pin 1, match:initial_title (Open Files)$
windowrule = float 1, center 1, pin 1, match:initial_title ^(Save As)$

# Dialog sizing
windowrule = size 70% 60%, match:initial_title ^(Authentication Required)$
windowrule = size 70% 60%, match:initial_title (Select Folder)$
windowrule = size 70% 60%, match:initial_title (Open Files)$
windowrule = size 70% 60%, match:initial_title ^(Save As)$


### BROWSER


windowrule = opacity 1.0 0.8, match:fullscreen 0, match:tag browser*


### SOCIAL MEDIA

windowrule = workspace 5, match:tag socialmedia*


### code_editor

windowrule = workspace 4, match:tag code_editor*

# Float VScode popups
windowrule = float 1, match:class (codium|codium-url-handler|VSCodium), match:title (.*codium.*|.*VSCodium.*)

# Remove transparancy if is oin workspace 4 and alone
windowrule = opacity 1.0 1.0, match:float 0, match:workspace w[tv1]s[false], match:tag code_editor*

# Smart borders and rounding when alone on workspace 4
windowrule = border_size 0, match:float 0, match:workspace w[tv1]s[false], match:tag code_editor*
windowrule = rounding 0, match:float 0, match:workspace w[tv1]s[false], match:tag code_editor*

### Photo/Video editors
windowrule = workspace 4, match:tag photo_video_editor*
windowrule = opacity 1.0 1.0, match:tag photo_video_editor*
windowrule = border_size 0, match:float 0, match:workspace w[tv1]s[false], match:tag photo_video_editor*
windowrule = rounding 0, match:float 0, match:workspace w[tv1]s[false], match:tag photo_video_editor*

### GAMELAUNCHER
windowrule = float 1, center 1, match:tag gamelauncher*
#windowrule = fullscreen 2, match:tag gamelauncher*


### GAMES

windowrule = no_blur 1, match:tag games*
windowrule = fullscreen 1, match:tag games*


### MUSIC

windowrule = tile 1, match:tag music*
windowrule = border_size 0, match:float 0, match:workspace w[tv1]s[false], match:tag code_editor*